<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ListenGlish — Aprende inglés con vídeos reales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Orbs de ambiente (CSS los anima) -->
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="orb orb-3" aria-hidden="true"></div>

    <!-- ===== CABECERA ===== -->
    <header class="header">
        <div class="header__inner">
            <a href="/" class="logo">Listen<span>Glish</span></a>

            <form class="search-form" id="searchForm">
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Busca una palabra… ej: creativity"
                    autocomplete="off"
                    spellcheck="false"
                >
                <button type="submit" class="search-btn">Buscar</button>
            </form>
        </div>
    </header>

    <main>

        <!-- ===== PANTALLA INICIAL ===== -->
        <section class="home-screen" id="homeScreen">
            <h1 class="home-title">Escucha inglés<br>en contexto real</h1>
            <p class="home-sub">Busca una palabra o frase y escucha cómo suena en la voz de hablantes nativos en vídeos reales.</p>
            <div class="home-history" id="homeHistory" hidden></div>
        </section>

        <!-- ===== CARGA ===== -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <!-- ===== SIN RESULTADOS ===== -->
        <div class="empty-state" id="emptyState">
            <p id="emptyMessage"></p>
        </div>

        <!-- ===== VISTA PRINCIPAL ===== -->
        <div class="player-view" id="playerView">

            <div class="player-topbar">
                <span class="result-counter" id="resultCounter"></span>
                <div class="video-meta" id="videoMeta"></div>
            </div>

            <div class="player-wrap">
                <div id="ytPlayer"></div>
            </div>

            <!-- Controles flotantes -->
            <div class="controls-bar">
                <button class="ctrl-btn" id="prevBtn" disabled title="Vídeo anterior">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                </button>
                <button class="ctrl-btn" id="rewindBtn" title="Retroceder 5 s">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                        <text x="12" y="14.5" text-anchor="middle" font-size="5.5" font-weight="700" font-family="DM Sans,system-ui">-5</text>
                    </svg>
                </button>
                <button class="ctrl-btn" id="resetBtn" title="Volver al inicio del clip">
                    <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                </button>
                <button class="ctrl-btn ctrl-btn--play" id="playPauseBtn" title="Play / Pausa">
                    <svg class="icon-play"  viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="ctrl-btn" id="nextBtn" title="Vídeo siguiente">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
                </button>
            </div>

            <div class="subtitle-block" id="subtitleBlock"></div>
            <div class="nav-dots" id="navDots"></div>

            <!-- ===== HISTORIAL (player) ===== -->
            <div class="history-section" id="historySection" hidden>
                <button class="history-toggle" id="historyToggle">Historial</button>
                <div class="history-grid" id="historyGrid" hidden></div>
            </div>

        </div>

        <!-- ===== DICCIONARIO ===== -->
        <aside class="dictionary-panel" id="dictionaryPanel" hidden>
            <button class="dictionary-close" id="dictionaryClose" aria-label="Cerrar">✕</button>
            <div class="dictionary-content" id="dictionaryContent"></div>
        </aside>

    </main>

    <!-- ===== MODAL HISTORIAL ===== -->
    <div class="history-modal-overlay" id="historyModal" hidden>
        <div class="history-modal-box">
            <div class="history-modal-header">
                <span class="history-modal-title">Historial completo</span>
                <button class="history-modal-close" id="historyModalClose" aria-label="Cerrar">✕</button>
            </div>
            <div class="history-modal-list" id="historyModalList"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
