spring:

  datasource:
    # En local usa los defaults (docker-compose).
    # En prod Railway inyecta SPRING_DATASOURCE_URL, _USERNAME y _PASSWORD.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/listenglish}
    username: ${SPRING_DATASOURCE_USERNAME:listenglish}
    password: ${SPRING_DATASOURCE_PASSWORD:listenglish}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway gestiona el schema; Hibernate solo valida.
      ddl-auto: validate
    # show-sql: false en prod (ruido y fuga de info). Override en application-local.yml.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public

# Token para /api/admin/**. Obligatorio en prod.
# En local pon ADMIN_TOKEN=dev-token (o lo que quieras) en application-local.yml.
app:
  admin-token: ${ADMIN_TOKEN:}

server:
  # Railway inyecta PORT con el puerto asignado dinámicamente.
  port: ${PORT:8080}

logging:
  level:
    org.hibernate.orm.jdbc.bind: ${LOG_SQL_BIND:OFF}
    org.flywaydb: INFO
    com.listenglish: ${LOG_APP_LEVEL:INFO}
