# Este archivo solo se carga cuando el perfil "test" de Spring está activo.
# (@ActiveProfiles("test") en la clase de test lo activa)
#
# Cuando se usa @ServiceConnection, Spring Boot sobreescribe automáticamente
# la URL, usuario y contraseña del datasource con los valores del contenedor
# de Testcontainers. No necesitamos configurar esos valores aquí.

spring:
  jpa:
    hibernate:
      # "validate" sigue funcionando perfectamente con Testcontainers:
      # Flyway crea las tablas, Hibernate las valida.
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.listenglish: DEBUG
    org.flywaydb: INFO
