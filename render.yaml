databases:
  - name: listenglish-db
    databaseName: listenglish
    user: listenglish
    plan: free

services:
  - type: web
    name: listenglish
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: listenglish-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
